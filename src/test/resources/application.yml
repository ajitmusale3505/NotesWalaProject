spring:
  datasource:
    url: jdbc:h2:mem:edunest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
cloudflare:
  r2:
    access-key: test-access
    secret-key: test-secret
    endpoint: https://example.com
    bucket: test-bucket
jwt:
  secret: test-secret-key-that-is-at-least-32-bytes-long-123456
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
app:
  bootstrap:
    seed-demo: false
  cors:
    allowed-origins: http://localhost:5173

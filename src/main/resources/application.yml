spring:
  application:
    name: edunest-backend

  datasource: 
    url: ${DB_URL:jdbc:postgresql://localhost:5432/noteswala}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}

server:
  port: ${SERVER_PORT:8080}

  error:
    include-message: never
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET:zenlearn-pdfs}

app:
  bootstrap:
    seed-demo: ${SEED_DEMO_DATA:false}
    admin-password: ${SEED_ADMIN_PASSWORD}
    demo-user-password: ${SEED_USER_PASSWORD}
    demo-contributor-password: ${SEED_CONTRIBUTOR_PASSWORD}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  security:
    debug-logging: ${SECURITY_DEBUG_LOGGING:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
